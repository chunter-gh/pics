<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16314f"><title>Pics — Termux Flick Sorter</title><link rel="stylesheet" href="./style.css?v=9"><script src="./app.js?v=9" defer></script></head><body><main class="app"><header class="topbar"><div><p class="eyebrow">TERMUX PHOTO SORTER</p><h1>Pics<span class="spark">✦</span> <small style="font-size:.38em;vertical-align:middle">V9</small></h1></div><div class="header-actions"><button id="scan" class="scan" type="button">Scan again</button></div></header><section class="summary"><span id="count">Starting Termux scan…</span><span id="root">Phone folder</span></section><p class="instruction">Slide the picture toward folder 1, 2, 3, 4, or 5 to move it.</p><section class="board"><button class="folder north" data-folder="1" type="button"><span class="folder-icon">▱</span><span>1</span></button><button class="folder east" data-folder="2" type="button"><span class="folder-icon">▱</span><span>2</span></button><button class="folder southeast" data-folder="3" type="button"><span class="folder-icon">▱</span><span>3</span></button><button class="folder southwest" data-folder="4" type="button"><span class="folder-icon">▱</span><span>4</span></button><button class="folder west" data-folder="5" type="button"><span class="folder-icon">▱</span><span>5</span></button><div id="photoCard" class="photo-card"><div id="photoEmpty" class="empty"><div class="empty-symbol">▧</div><strong>Starting Pics V9…</strong><span>Termux is reading the phone folder.</span></div><img id="photo" alt="1.jpg" draggable="false" hidden></div></section><div class="photo-info"><span id="filename"></span><span id="location"></span></div><div class="actions"><button id="skip" type="button" disabled>Skip for now →</button><span id="status" role="status" aria-live="polite"></span></div><footer>Local only: Termux reads and moves the files. Nothing is uploaded.</footer></main></body></html>
